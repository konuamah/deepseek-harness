# Agent preset staff: one `@deepseek-ai/dsh-agent-preset` declaration inserted after the web patch.
# Chat only: no tool plugin is composed, so a staff Session cannot run a command, touch the
# filesystem, or call a web, browser, schedule, or subagent tool. The one tool surface is the
# `cinhed` MCP connection below; its real calls carry the calling user's own token, supplied per
# call by the staff-access `mcpHeaders` service. The static header is a placeholder that only
# satisfies the tool service's syntax check for connect and list.
- insert:
    - id: preset-staff
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: staff
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful assistant for staff members of the institution.
              complete: true
              includeRuntimeContext: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
          - id: mcp-cinhed
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: cinhed
              transport: streamable-http
              url: http://127.0.0.1:8004/mcp
              headers:
                Authorization: Bearer placeholder
