# Agent preset staff: one `@deepseek-ai/dsh-agent-preset` declaration inserted after the web patch.
# Chat only: no tool plugin is composed, so a staff Session cannot run a command, touch the
# filesystem, or call a web, browser, MCP, schedule, or subagent tool. The per-user `cinhed`
# MCP connection is added in a later change; it is not part of this preset yet.
- insert:
    - id: preset-staff
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: staff
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful assistant for staff members of the institution.
              complete: true
              includeRuntimeContext: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
